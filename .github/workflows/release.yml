name: Release

on:
  push:
    tags:
      - "sdk@v*"
      - "cc-bot@v*"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: github.repository == 'pawastation/wechat-ilink-bot'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Install npm 11+ for Trusted Publishing
        run: npm install -g npm@latest

      - name: Determine package from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == sdk@v* ]]; then
            echo "dir=packages/ilink-bot-sdk" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#sdk@v}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == cc-bot@v* ]]; then
            echo "dir=packages/ilink-cc-bot" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#cc-bot@v}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unrecognized tag format: $TAG"
            exit 1
          fi

      - name: Verify version matches tag
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.pkg.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          # Use pnpm pack to resolve workspace:* protocol, then publish the tarball
          TARBALL=$(pnpm pack --pack-destination /tmp 2>/dev/null | tail -1)
          npm publish "/tmp/$TARBALL" --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.pkg.outputs.version }}"
          DIR="${{ steps.pkg.outputs.dir }}"
          NOTES=""
          if [ -f "$DIR/CHANGELOG.md" ]; then
            NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" "$DIR/CHANGELOG.md")
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
